<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Theraqua.med</title>
    <!--
      GitHub Pages hat kein Server-Side-Routing: ein direkter Aufruf einer
      React-Router-Route (z.B. /theraqua.med/kursangebot) landet hier statt
      bei index.html. Wir kodieren den Pfad in einen Query-String und leiten
      auf index.html um; dort dekodiert ein Gegenstück in index.html den Pfad
      wieder zurück, bevor React mountet. Standard-Pattern:
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
